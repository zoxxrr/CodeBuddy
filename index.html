<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101019">
  <meta name="description" content="Learn Roblox Luau through practical lessons, coding challenges, and a personal learning path.">
  <title>CodeBuddy — Learn Luau by building</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-view="dashboard"><span class="brand-mark">C</span><span>CodeBuddy<span class="brand-dot">.</span><small>LEARN · BUILD · LEVEL UP</small></span></a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span> Overview</button>
        <button class="nav-item" data-view="learn"><span class="nav-icon">▤</span> Learning paths</button>
        <button class="nav-item" data-view="reviews"><span class="nav-icon">◷</span> Review queue <span class="nav-count" id="review-count">0</span></button>
        <button class="nav-item" data-view="leaderboard"><span class="nav-icon">♜</span> Leaderboard</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-card"><div class="sparkle">✦</div><strong>Small steps. Real skills.</strong><p>Every concept you practice makes the next one easier.</p><button class="text-button" data-view="learn">Explore curriculum <span>→</span></button></div>
        <div class="sidebar-user" id="sidebar-user"><div class="avatar">?</div><div><strong>Guest learner</strong><small>Progress saved to this browser session</small></div><button class="icon-button" id="auth-open" aria-label="Sign in">↗</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button><div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb-current">Overview</strong></div><div class="top-actions"><div class="streak-chip">♨ <span id="top-streak">0 day streak</span></div><button class="avatar top-avatar" id="profile-button" aria-label="Profile">?</button></div></header>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <section id="view-root" class="view-root" tabindex="-1"></section>
    </main>
  </div>
  <dialog id="auth-dialog" class="modal">
    <form method="dialog" class="modal-close"><button aria-label="Close">×</button></form>
    <div class="modal-heading"><div class="brand-mark">C</div><h2 id="auth-title">Welcome back</h2><p id="auth-subtitle">Pick up where your curiosity left off.</p></div>
    <form id="auth-form" class="stack-form">
      <label id="username-field" class="field hidden">Username<input name="username" minlength="3" maxlength="20" autocomplete="username"></label>
      <label class="field">Username or email<input name="login" id="login-field" autocomplete="username" required></label>
      <label id="email-field" class="field hidden">Email<input name="email" type="email" autocomplete="email"></label>
      <label class="field">Password<input name="password" type="password" minlength="10" autocomplete="current-password" required></label>
      <p class="form-error" id="auth-error"></p>
      <button class="button primary full" id="auth-submit">Sign in</button>
      <button type="button" class="text-button centered" id="auth-toggle">New here? Create an account</button>
    </form>
  </dialog>
</body>
</html>
